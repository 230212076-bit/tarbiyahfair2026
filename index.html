<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b1a17">
  <meta name="description" content="Pendaftaran perlombaan Tarbiyah Fair XI 2026 telah ditutup. Terima kasih kepada semua pendaftar!">
  <title>Pendaftaran Ditutup — Tarbiyah Fair XI 2026</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      color: #e6f0ec;
      background: #0b1a17;
      font-synthesis: none;
      text-rendering: optimizeLegibility;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    * { box-sizing: border-box; }

    body {
      min-width: 320px;
      min-height: 100vh;
      min-height: 100svh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 28px 20px;
      overflow-x: hidden;
      background:
        radial-gradient(ellipse at 50% 40%, rgba(35, 91, 73, .32), transparent 58%),
        #0b1a17;
    }

    main {
      width: min(100%, 680px);
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }

    .event {
      margin: 0 0 12px;
      color: #4cc2a0;
      font-size: .78rem;
      font-weight: 700;
      letter-spacing: .16em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-family: "Trebuchet MS", system-ui, sans-serif;
      font-size: clamp(2.35rem, 9vw, 4.5rem);
      font-weight: 800;
      letter-spacing: -.045em;
      line-height: 1;
      text-wrap: balance;
    }

    h1 span { color: #e3b655; }

    .message {
      margin: 18px 0 0;
      color: #b6c8c1;
      font-size: clamp(1rem, 3.5vw, 1.15rem);
      line-height: 1.7;
      text-wrap: balance;
    }

    .mascot {
      order: 1;
      display: block;
      width: clamp(170px, 42vw, 250px);
      height: auto;
      margin-top: 24px;
      filter: drop-shadow(0 16px 24px rgba(0, 0, 0, .28));
    }

    @media (max-width: 420px) {
      body { padding-inline: 18px; }
      .event { font-size: .7rem; }
      .mascot { width: min(54vw, 210px); margin-top: 18px; }
    }
  </style>
</head>
<body>
  <main>
    <p class="event">Tarbiyah Fair XI &middot; 2026</p>
    <h1>Pendaftaran Perlombaan <span>Ditutup</span></h1>
    <p class="message">Terima kasih kepada semua pendaftar! Sampai bertemu di Tarbiyah Fair XI.</p>
    <img class="mascot" src="assets/maskot.png" width="637" height="900" alt="Maskot Tarbiyah Fair XI, gajah berpeci hijau yang melambaikan tangan">
  </main>
</body>
</html>
